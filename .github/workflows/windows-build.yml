name: Windows prototype build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch KayKit Skeleton assets
        shell: bash
        run: |
          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Skeletons-1.0.git /tmp/kaykit
          mkdir -p addons
          cp -R /tmp/kaykit/addons/kaykit_character_pack_skeletons addons/

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot

          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -R /tmp/export-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          godot --version

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported script compilation errors during import."
            exit 1
          fi

      - name: Runtime smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 8s godot --headless --path . 2>&1 | tee /tmp/godot-runtime.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            exit $status
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" /tmp/godot-runtime.log; then
            echo "Godot reported script errors while starting the game."
            exit 1
          fi

      - name: Export Windows executable
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/SandGame.exe 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" /tmp/godot-export.log; then
            echo "Godot reported script errors during export."
            exit 1
          fi
          test -s build/SandGame.exe
          ls -lh build/SandGame.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SandGame-Windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/SandGame.exe
          if-no-files-found: error
          retention-days: 14
